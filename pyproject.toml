[project]
name = "allthebest"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx>=0.28.1",
  "langgraph>=1.2.7",
  "openrouter>=1.1.39",
  "playwright>=1.61.0",
  "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
